<!DOCtype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Birds Of Australia</title>
    <style> :root {
      --primary-color: rgb(247, 241, 241);
      --secondary-color: rgb(248, 211, 3);
      --bg-color: rgb(179, 179, 182);
      --font-color: rgb(4, 116, 41);
      --heading-color: rgb(54, 68, 250);
    }
      [data-theme="dark"]{
        --primary-color: rgb(63, 63, 62);
       --secondary-color: rgb(245, 245, 2);
       --bg-color: rgb(0, 3, 7);
       --font-color: rgb(250, 246, 246);
       --heading-color: rgb(139, 139, 135);
      }
      main {max-width: 1100px; margin: 0 auto;}
      main {background-color: var(--bg-color)}
      h1 {color: var(--heading-color)}
      p {color: var(--font-color); background-color: var(--primary-color);}
      button {background-color: var(--secondary-color);}
    </style>
    
    <script>
      const birds = {
      pardalote: {
        src: "http://www.outgrabe.net/bird00.jpg",
        alt: "Pardalote",
        credit: "Pardalote by fir0002 (CC-by-NC)"
      },
      "purple-swamp-hen": {
        src: "http://www.outgrabe.net/bird01.jpg",
        alt: "Purple Swamp Hen",
        credit: "Purple Swamp Hen by Toby Hudson (CC-by-SA)"
      },
      "white-headed-stilt": {
        src: "http://www.outgrabe.net/bird02.jpg",
        alt: "White-headed Stilt",
        credit: "White-headed Stilt by JJ Harrison (CC-by-SA)"
      },
      "inland-thornbill": {
        src: "http://www.outgrabe.net/bird03.jpg",
        alt: "Inland Thornbill",
        credit: "Inland Thornbill by Peter Jacob (CC-by-SA)"
      },
      "rose-robin": {
        src: "http://www.outgrabe.net/bird04.jpg",
        alt: "Rose Robin",
        credit: "Rose Robin by JJ Harrison (CC-by-SA)"
      }
    };

    function changebird(bird) {
      const birdData = birds[bird];
      const image = document.getElementById("bird-image");
      const credit = document.getElementById("credit");

      image.src = birdData.src;
      image.alt = birdData.alt;
      credit.textContent = birdData.credit;
    }
    function changetheme() {
      var root = document.documentElement;
      var currenttheme = root.getAttribute("data-theme");
      if (currenttheme === "dark") {
        root.setAttribute("data-theme", "light");
      }
      else {root.setAttribute("data-theme", "dark")}
      }
    
    </script>
  </head>
  
  <body>
    <main>
      <h1>Birds Of Australia</h1>

      <img id="bird-image" src="http://www.outgrabe.net/bird00.jpg" alt="Pardalote" width="1100" height="700">
      
      <p id = "credit">Pardalote by fir0002 (CC-by-NC)</p>

      <div> 
        <button type="button" onclick="changebird('pardalote')">
          Pardalote</button>
        <button type="button" onclick="changebird('purple-swamp-hen')">
          Purple Swamp Hen</button>
        <button type="button" onclick="changebird('white-headed-stilt')">
          White-headed Stilt</button>
        <button type="button" onclick="changebird('inland-thornbill')">
          Inland Thornbill</button>
        <button type="button" onclick="changebird('rose-robin')">
          Rose Robin</button>
      </div>

      <button type="button" onclick="changetheme()">
        Toggle Theme
      </button>

    </main>
  </body>
</html>
